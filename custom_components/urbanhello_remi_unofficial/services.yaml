create_alarm:
  fields:
    name:
      required: true
      example: Wake up
      selector:
        text: null
    time:
      required: true
      example: 07:00
      selector:
        time: null
    enabled:
      default: true
      selector:
        boolean: null
    repeat:
      default: []
      example: '[1, 2, 3, 4, 5]'
      selector:
        object: null
    face_define:
      example: awake
      selector:
        select:
          options:
          - 'off'
          - awake
          - sleepy
          - semi_awake
          - smiley
          translation_key: alarm_face
    volume:
      selector:
        number:
          min: 0
          max: 100
          step: 1
    brightness:
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider
    music_path:
      selector:
        text: {}
    music_duration_minutes:
      selector:
        number:
          min: 0
          max: 1440
          step: 1
          mode: box
          unit_of_measurement: min
    play_button_enabled:
      selector:
        boolean: {}
    remi_id:
      selector:
        text: {}
