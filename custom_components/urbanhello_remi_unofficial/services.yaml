create_alarm:
  fields:
    name:
      required: true
      example: Wake up
      selector:
        text: null
    time:
      required: true
      example: 07:00
      selector:
        time: null
    enabled:
      default: true
      selector:
        boolean: null
    repeat:
      default: []
      example: '[1, 2, 3, 4, 5]'
      selector:
        object: null
    face_define:
      example: awake
      selector:
        select:
          options:
          - 'off'
          - awake
          - sleepy
          - semi_awake
          - smiley
          translation_key: alarm_face
    volume:
      selector:
        number:
          min: 0
          max: 100
          step: 1
update_alarm:
  fields:
    event_id:
      required: true
      example: abc123XYZ
      selector:
        text: null
    name:
      selector:
        text: null
    time:
      example: 07:00
      selector:
        time: null
    enabled:
      selector:
        boolean: null
    repeat:
      selector:
        object: null
    face_define:
      selector:
        select:
          options:
          - 'off'
          - awake
          - sleepy
          - semi_awake
          - smiley
          translation_key: alarm_face
    volume:
      selector:
        number:
          min: 0
          max: 100
          step: 1
delete_alarm:
  fields:
    event_id:
      required: true
      example: abc123XYZ
      selector:
        text: null
