name: Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Declare default permissions as read only.
permissions: read-all

jobs:

  # -- TESTS ------------------------------------------------------------------
  tests:
    name: Tests (Home Assistant 2026.11.0)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Harden GitHub Actions Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install uv==0.13.7
          python -m uv pip install --system -r requirements-test.txt

      - name: Verify Home Assistant runtime
        run: |
          python -c 'from importlib.metadata import version; assert version("homeassistant") == "2026.11.0"; print("Home Assistant", version("homeassistant"))'

      - name: Run tests with coverage
        run: python scripts/run_tests.py --cov --cov-report=xml --cov-report=term-missing

      - name: Test bundled card and loader
        run: node --test tests/*.test.mjs
