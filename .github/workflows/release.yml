name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version recorded in manifest and changelog (X.Y.Z or X.Y.Z-beta.N)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository == 'Mins95/ha-remi' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_SHA: ${{ github.sha }}

    steps:
      - name: Harden GitHub Actions Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout the requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.10"
          cache: "pip"

      - name: Validate version and prepare release notes
        env:
          RELEASE_NOTES: ${{ runner.temp }}/release-notes.md
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          version = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-beta\.[1-9][0-9]*)?", version):
              raise SystemExit("Version must be X.Y.Z or X.Y.Z-beta.N")

          manifest_path = Path("custom_components/urbanhello_remi_unofficial/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("version") != version:
              raise SystemExit("Version does not match manifest.json")

          tag = subprocess.run(
              ["git", "show-ref", "--verify", "--quiet", f"refs/tags/{version}"],
              check=False,
          )
          if tag.returncode == 0:
              raise SystemExit("This version already has a tag; choose a new version")
          if tag.returncode != 1:
              raise SystemExit("Could not verify the existing tags")

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(
              rf"^#{{1,2}}[ \t]+(?:\[{re.escape(version)}\]|{re.escape(version)})(?=[ \t(]|$)[^\n]*$",
              re.MULTILINE,
          )
          entries = list(heading.finditer(changelog))
          if len(entries) != 1:
              raise SystemExit("CHANGELOG.md must contain exactly one heading for this version")
          body = changelog[entries[0].end():]
          next_release = re.search(r"^#{1,2}[ \t]+", body, re.MULTILINE)
          notes = body[:next_release.start()] if next_release else body
          notes = notes.strip()
          if not notes:
              raise SystemExit("The changelog entry must contain release notes")
          Path(os.environ["RELEASE_NOTES"]).write_text(notes + "\n", encoding="utf-8")

      - name: Install test dependencies
        run: |
          python -m pip install uv==0.13.7
          python -m uv pip install --system -r requirements-test.txt

      - name: Verify Home Assistant runtime
        run: |
          python -c 'from importlib.metadata import version; assert version("homeassistant") == "2026.11.0"; print("Home Assistant", version("homeassistant"))'

      - name: Run tests
        run: python scripts/run_tests.py

      - name: Test bundled card and loader
        run: node --test tests/*.test.mjs

      - name: Publish the tested release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          release_flags=()
          if [[ "$RELEASE_VERSION" == *-beta.* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_VERSION" \
            --repo "$GH_REPO" \
            --target "$RELEASE_SHA" \
            --title "$RELEASE_VERSION" \
            --notes-file "$RELEASE_NOTES" \
            "${release_flags[@]}"
