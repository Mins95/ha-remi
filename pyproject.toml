[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Official HA test configuration: allow its httpx2 alias before respx imports.
addopts = "-p no:respx"
pythonpath = ["."]

[tool.coverage.run]
source = ["custom_components/urbanhello_remi_unofficial"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70
